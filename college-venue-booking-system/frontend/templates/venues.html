<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venues - Smart College Venue Booking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-building me-2"></i>VenueBook
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="bi bi-house-door me-1"></i>Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/venues.html"><i class="bi bi-geo-alt me-1"></i>Venues</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/schedule.html"><i class="bi bi-calendar3 me-1"></i>Events</a>
                    </li>
                </ul>
                <div id="authNav" class="d-flex">
                    <!-- Will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <section class="bg-primary text-white py-4">
        <div class="container">
            <h1 class="h2 mb-0"><i class="bi bi-geo-alt me-2"></i>Browse Venues</h1>
            <p class="mb-0 opacity-75">Find and book the perfect venue for your event</p>
        </div>
    </section>

    <!-- Filters Section -->
    <section class="bg-white border-bottom py-3">
        <div class="container">
            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label">Search</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" id="searchInput" placeholder="Search venues...">
                    </div>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Category</label>
                    <select class="form-select" id="typeFilter">
                        <option value="">All Categories</option>
                        <option value="Event Venues">Event Venues</option>
                        <option value="Academic Rooms">Academic Rooms</option>
                        <option value="Computer Labs">Computer Labs</option>
                        <option value="Department Facilities">Department Facilities</option>
                        <option value="Sports Facilities">Sports Facilities</option>
                        <option value="Social Spaces">Social Spaces</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Min Capacity</label>
                    <input type="number" class="form-control" id="capacityFilter" placeholder="Any">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Status</label>
                    <select class="form-select" id="statusFilter">
                        <option value="">All Status</option>
                        <option value="available">Available</option>
                        <option value="unavailable">Unavailable</option>
                        <option value="maintenance">Maintenance</option>
                    </select>
                </div>
                <div class="col-md-1">
                    <button class="btn btn-outline-secondary w-100" onclick="clearFilters()">
                        <i class="bi bi-x-circle"></i>
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Venues Grid -->
    <section class="py-4">
        <div class="container">
            <div class="row g-4" id="venuesGrid">
                <!-- Venues will be loaded here -->
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2">Loading venues...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Venue Detail Modal -->
    <div class="modal fade" id="venueModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="venueModalTitle">Venue Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="venueModalBody">
                    <!-- Venue details will be loaded here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="bookVenueBtn">
                        <i class="bi bi-calendar-plus me-1"></i>Book This Venue
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
        let currentVenueId = null;
        const venueModal = new bootstrap.Modal(document.getElementById('venueModal'));

        // Initialize page
        document.addEventListener('DOMContentLoaded', async () => {
            updateNavigation();
            
            // Check for category filter from URL
            const urlParams = new URLSearchParams(window.location.search);
            const typeParam = urlParams.get('type');
            if (typeParam) {
                document.getElementById('typeFilter').value = typeParam;
            }
            
            await loadVenues();
            
            // Add filter event listeners
            document.getElementById('searchInput').addEventListener('input', debounce(loadVenues, 300));
            document.getElementById('typeFilter').addEventListener('change', loadVenues);
            document.getElementById('capacityFilter').addEventListener('input', debounce(loadVenues, 300));
            document.getElementById('statusFilter').addEventListener('change', loadVenues);
        });

        async function loadVenues() {
            const grid = document.getElementById('venuesGrid');
            const search = document.getElementById('searchInput').value;
            const type = document.getElementById('typeFilter').value;
            const minCapacity = document.getElementById('capacityFilter').value;
            const status = document.getElementById('statusFilter').value;

            try {
                const venues = await API.getVenues(search, type, minCapacity, status);
                
                if (venues.length === 0) {
                    grid.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="bi bi-emoji-frown display-1 text-muted"></i>
                            <h4 class="mt-3">No venues found</h4>
                            <p class="text-muted">Try adjusting your filters</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                venues.forEach(venue => {
                    const statusBadge = venue.status === 'available' 
                        ? '<span class="badge bg-success">Available</span>'
                        : venue.status === 'maintenance'
                        ? '<span class="badge bg-warning">Maintenance</span>'
                        : '<span class="badge bg-danger">Unavailable</span>';

                    const typeIcon = getTypeIcon(venue.type);

                    html += `
                        <div class="col-md-6 col-lg-4">
                            <div class="card h-100 shadow-sm hover-card cursor-pointer" onclick="showVenueDetail(${venue.id})">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-start mb-2">
                                        <h5 class="card-title mb-0">
                                            <i class="${typeIcon} me-1 text-primary"></i>${venue.name}
                                        </h5>
                                        ${statusBadge}
                                    </div>
                                    <p class="text-muted small mb-2">
                                        <i class="bi bi-tag me-1"></i>${venue.type}
                                    </p>
                                    <div class="d-flex gap-3 text-muted small">
                                        <span><i class="bi bi-people me-1"></i>${venue.capacity} seats</span>
                                        ${venue.location ? `<span><i class="bi bi-geo me-1"></i>${venue.location}</span>` : ''}
                                    </div>
                                    ${venue.facilities ? `<p class="card-text small mt-2 text-truncate">${venue.facilities}</p>` : ''}
                                </div>
                                <div class="card-footer bg-transparent border-top-0">
                                    <small class="text-muted">Click for details</small>
                                </div>
                            </div>
                        </div>
                    `;
                });
                grid.innerHTML = html;

            } catch (error) {
                grid.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="bi bi-exclamation-triangle display-1 text-danger"></i>
                        <h4 class="mt-3">Error loading venues</h4>
                        <p class="text-muted">${error.message}</p>
                        <button class="btn btn-primary" onclick="loadVenues()">Retry</button>
                    </div>
                `;
            }
        }

        async function showVenueDetail(venueId) {
            currentVenueId = venueId;
            const modalBody = document.getElementById('venueModalBody');
            const modalTitle = document.getElementById('venueModalTitle');
            const bookBtn = document.getElementById('bookVenueBtn');

            modalBody.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>';
            venueModal.show();

            try {
                const venue = await API.getVenue(venueId);
                modalTitle.innerHTML = `<i class="${getTypeIcon(venue.type)} me-1"></i>${venue.name}`;

                const statusBadge = venue.status === 'available' 
                    ? '<span class="badge bg-success fs-6">Available</span>'
                    : venue.status === 'maintenance'
                    ? '<span class="badge bg-warning fs-6">Under Maintenance</span>'
                    : '<span class="badge bg-danger fs-6">Unavailable</span>';

                bookBtn.style.display = venue.status === 'available' ? 'inline-block' : 'none';

                modalBody.innerHTML = `
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <h6 class="text-muted mb-1">Type</h6>
                                <p class="mb-0">${venue.type}</p>
                            </div>
                            <div class="mb-3">
                                <h6 class="text-muted mb-1">Capacity</h6>
                                <p class="mb-0"><i class="bi bi-people me-1"></i>${venue.capacity} people</p>
                            </div>
                            <div class="mb-3">
                                <h6 class="text-muted mb-1">Location</h6>
                                <p class="mb-0"><i class="bi bi-geo-alt me-1"></i>${venue.location || 'Not specified'}</p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <h6 class="text-muted mb-1">Status</h6>
                                <p class="mb-0">${statusBadge}</p>
                            </div>
                            <div class="mb-3">
                                <h6 class="text-muted mb-1">Description</h6>
                                <p class="mb-0">${venue.description || 'No description available'}</p>
                            </div>
                        </div>
                    </div>
                    <hr>
                    <div class="mb-0">
                        <h6 class="text-muted mb-2"><i class="bi bi-tools me-1"></i>Facilities</h6>
                        <div class="d-flex flex-wrap gap-2">
                            ${venue.facilities ? venue.facilities.split(',').map(f => 
                                `<span class="badge bg-light text-dark">${f.trim()}</span>`
                            ).join('') : '<span class="text-muted">No facilities listed</span>'}
                        </div>
                    </div>
                `;

            } catch (error) {
                modalBody.innerHTML = `<div class="alert alert-danger">Error loading venue details: ${error.message}</div>`;
            }
        }

        document.getElementById('bookVenueBtn').addEventListener('click', () => {
            const user = API.getCurrentUser();
            if (!user) {
                venueModal.hide();
                window.location.href = '/login.html?redirect=' + encodeURIComponent('/booking.html?venue=' + currentVenueId);
                return;
            }
            window.location.href = '/booking.html?venue=' + currentVenueId;
        });

        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('typeFilter').value = '';
            document.getElementById('capacityFilter').value = '';
            document.getElementById('statusFilter').value = '';
            loadVenues();
        }

        function getTypeIcon(type) {
            const icons = {
                'Event Venues': 'bi-megaphone',
                'Academic Rooms': 'bi-book',
                'Computer Labs': 'bi-pc-display',
                'Department Facilities': 'bi-building',
                'Sports Facilities': 'bi-trophy',
                'Social Spaces': 'bi-people'
            };
            return icons[type] || 'bi-geo-alt';
        }

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        function updateNavigation() {
            const user = API.getCurrentUser();
            const authNav = document.getElementById('authNav');

            if (user) {
                authNav.innerHTML = `
                    <span class="navbar-text me-3 text-white">
                        <i class="bi bi-person-circle me-1"></i>${user.name}
                    </span>
                    <a href="/my-bookings.html" class="btn btn-outline-light btn-sm me-2">
                        <i class="bi bi-calendar-check me-1"></i>My Bookings
                    </a>
                    <button class="btn btn-outline-light btn-sm" onclick="API.logout(); window.location.reload();">
                        <i class="bi bi-box-arrow-right me-1"></i>Logout
                    </button>
                `;
            } else {
                authNav.innerHTML = `
                    <a href="/login.html" class="btn btn-outline-light btn-sm me-2">Login</a>
                    <a href="/register.html" class="btn btn-light btn-sm">Register</a>
                `;
            }
        }
    </script>
</body>
</html>
